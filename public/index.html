<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Eruda MUST be the first thing in the document -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        try {
            eruda.init();
            console.log("Eruda initialized successfully.");
        } catch (e) {
            console.error("Eruda failed to init:", e);
        }
    </script>
    <title>SWAN Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-green-400 p-4">
    <div id="terminal" class="h-[60vh] border border-green-800 p-2 overflow-y-auto"></div>
    <input id="prompt" class="w-full bg-gray-900 border border-green-800 p-2 mt-2 text-white">
    <button id="run" class="mt-2 bg-green-900 px-4 py-2">RUN INFERENCE</button>

    <script type="module">
        import { SwanPipeline, SwanUI, SwanStorage } from './js/swan.js';
        import { AutoTokenizer } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1/dist/transformers.min.js';

        async function bootstrap() {
            try {
                // If this logs, we are definitely talking to the server
                console.log("Bootstrap starting...");
                await SwanPipeline.ensureReady(SwanUI);
                const tokenizer = await AutoTokenizer.from_pretrained('Xenova/Qwen1.5-0.5B');
                SwanUI.log("Tokenizer ready. Engine operational.");
                
                document.getElementById('run').onclick = async () => {
                    const file = await SwanStorage.getModelFile('embed.bin', '/model/i7/projected_embed_tokens.bin');
                    SwanUI.log(`File loaded: ${file.size} bytes`);
                };
            } catch (e) {
                console.error("Bootstrap error:", e);
                SwanUI.log(e.message, 'error');
            }
        }
        bootstrap();
    </script>
</body>
</html>
