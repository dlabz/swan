<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAN | Inference Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-green-400 font-mono p-4 flex flex-col h-screen">
    <div class="max-w-3xl mx-auto w-full flex flex-col h-full">
        <header class="mb-4 border-b border-green-800 pb-4 shrink-0">
            <h1 class="text-2xl font-bold tracking-widest text-white">SWAN INFERENCE</h1>
            <div id="status" class="text-xs text-yellow-500 font-bold">Checking manifold...</div>
        </header>

        <div id="terminal" class="bg-gray-900 p-4 rounded border border-green-800 mb-4 flex-1 overflow-y-auto text-xs whitespace-pre-wrap"></div>

        <div id="controls" class="hidden flex gap-2 shrink-0">
            <input type="text" id="prompt" class="flex-1 bg-gray-900 border border-green-800 p-3 text-white outline-none" placeholder="Enter query...">
            <button onclick="runInference()" class="bg-green-900 px-6 py-2 hover:bg-green-700 text-white font-bold transition" id="sendBtn">SEND</button>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const statusDiv = document.getElementById('status');
        const controls = document.getElementById('controls');
        const sendBtn = document.getElementById('sendBtn');

        let logBuffer = [];
        let isLogging = false;

        function flushLogs() {
            if (logBuffer.length === 0) {
                isLogging = false;
                return;
            }
            terminal.innerHTML += logBuffer.join('');
            logBuffer = [];
            terminal.scrollTop = terminal.scrollHeight;
            requestAnimationFrame(flushLogs);
        }

        function logToTerminal(msg, type = 'log') {
            const color = type === 'error' ? 'text-red-500' : type === 'system' ? 'text-blue-400 font-bold' : 'text-green-500';
            logBuffer.push(`<div class="${color}">> ${msg}</div>`);
            if (!isLogging) {
                isLogging = true;
                requestAnimationFrame(flushLogs);
            }
            if (type === 'error') console.error(msg);
            else console.log(msg);
        }

        function connectSSE() {
            const evtSource = new EventSource("/api/events");
            evtSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    logToTerminal(data.message, data.type);
                    if (data.type === 'complete') setReady();
                    else if (data.type === 'error') setError();
                } catch (e) {}
            };
        }

        function setReady() {
            statusDiv.innerText = "System Ready [I7 Manifold Active]";
            statusDiv.className = "text-xs text-blue-500 font-bold";
            controls.classList.remove('hidden');
        }

        function setError() {
            statusDiv.innerText = "System Fault";
            statusDiv.className = "text-xs text-red-500 font-bold";
        }

        async function init() {
            logToTerminal("System terminal initialized...", "log");
            connectSSE();
            try {
                const res = await fetch('/api/check');
                if ((await res.json()).ready) {
                    setReady();
                    logToTerminal("F32 Cache & I7 Manifold Verified.", "system");
                } else {
                    statusDiv.innerText = "Installing: Building pipeline...";
                    await fetch('/api/install');
                }
            } catch(e) {
                logToTerminal("Check failed. Retrying...", "error");
            }
        }

        // --- EXPLICIT CHUNKED OPFS DOWNLOADER ---
        async function getModelFromOPFS(filename, url) {
            const opfsRoot = await navigator.storage.getDirectory();
            
            // 1. Get exact file size from server using HEAD request
            const headRes = await fetch(url, { method: 'HEAD' });
            if (!headRes.ok) throw new Error(`Could not fetch metadata for ${filename}`);
            const totalSize = parseInt(headRes.headers.get('content-length'), 10);
            
            // 2. Check if we already have it fully downloaded
            let fileHandle = await opfsRoot.getFileHandle(filename, { create: true });
            let fileInfo = await fileHandle.getFile();
            
            if (fileInfo.size === totalSize) {
                logToTerminal(`Found complete ${filename} in OPFS storage.`, 'system');
                return fileInfo;
            }

            // 3. Download in strict 5MB chunks to prevent memory spikes & connection drops
            logToTerminal(`Downloading ${filename} in chunks to bypass memory limits...`, 'system');
            const writable = await fileHandle.createWritable();
            
            const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB chunks
            let downloaded = 0;

            while (downloaded < totalSize) {
                const end = Math.min(downloaded + CHUNK_SIZE - 1, totalSize - 1);
                
                // Request specific byte range (HTTP 206 Partial Content)
                const res = await fetch(url, {
                    headers: { 'Range': `bytes=${downloaded}-${end}` }
                });
                
                if (!res.ok && res.status !== 206) {
                    throw new Error(`Chunk download failed at byte ${downloaded}`);
                }

                // Write chunk to OPFS and let garbage collector clear the memory
                const chunkBuffer = await res.arrayBuffer();
                await writable.write(chunkBuffer);
                
                downloaded = end + 1;
                
                // Update UI
                statusDiv.innerText = `Downloading: ${(downloaded / 1024 / 1024).toFixed(1)} / ${(totalSize / 1024 / 1024).toFixed(1)} MB`;
            }

            await writable.close();
            logToTerminal(`Successfully assembled and saved ${filename} to OPFS.`, 'system');
            
            return await fileHandle.getFile(); 
        }

        // --- EGRESS DECODER ---
        function performEgress(bestTokenId, maxActivation) {
            logToTerminal(`[EGRESS] Phase started...`, 'system');
            logToTerminal(`- Winning Token ID: ${bestTokenId}`, 'system');
            logToTerminal(`- Max Logit Activation: ${maxActivation.toFixed(4)}`, 'system');

            const mockVocab = ["unknown", "hello", "world", "swan", "engine", "awake", "manifold", "resonance", "active", "system"];
            const mappedWord = mockVocab[bestTokenId % mockVocab.length];
            logToTerminal(`\nOUTPUT: "${mappedWord.toUpperCase()}"`, 'log');
        }
        
        async function runInference() {
            const input = document.getElementById('prompt').value;
            if (!input) return;

            sendBtn.disabled = true;
            logToTerminal(`[INGEST] Input: ${input}`, 'log');
            
            const HIDDEN_SIZE = 1536; 
            const hiddenState = new Float32Array(HIDDEN_SIZE);
            const tokens = input.toLowerCase().split(' ').map(w => {
                let hash = 0;
                for (let i = 0; i < w.length; i++) hash = (hash << 5) - hash + w.charCodeAt(i);
                return Math.abs(hash) % 1000;
            });
            for(let i=0; i < hiddenState.length; i++) {
                hiddenState[i] = Math.tanh((tokens[i % tokens.length]) * 0.003);
            }
            
            try {
                // Ensure the file is safely in OPFS via chunks
                const file = await getModelFromOPFS('projected_embed_tokens.bin', '/model/i7/projected_embed_tokens.bin');
                logToTerminal("[MANIFOLD] Streaming lm_head projection from OPFS...", 'system');

                const reader = file.stream().getReader();
                let processedBytes = 0;
                let leftover = new Uint8Array(0);
                let loopCount = 0;

                let maxActivation = -Infinity;
                let bestTokenId = -1;
                let currentTokenId = 0;
                let currentActivation = 0;
                let hiddenDimIndex = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    processedBytes += value.length;

                    const merged = new Uint8Array(leftover.length + value.length);
                    merged.set(leftover);
                    merged.set(value, leftover.length);

                    const validLength = merged.length - (merged.length % 4);
                    leftover = merged.slice(validLength); 

                    const floats = new Float32Array(merged.buffer, merged.byteOffset, validLength / 4);

                    for(let i = 0; i < floats.length; i++) {
                        currentActivation += floats[i] * hiddenState[hiddenDimIndex];
                        hiddenDimIndex++;

                        if (hiddenDimIndex === HIDDEN_SIZE) {
                            if (currentActivation > maxActivation) {
                                maxActivation = currentActivation;
                                bestTokenId = currentTokenId;
                            }
                            currentTokenId++;
                            currentActivation = 0;
                            hiddenDimIndex = 0;
                        }
                    }

                    loopCount++;
                    if (loopCount % 5 === 0) {
                        statusDiv.innerText = `Computing Egress: ${(processedBytes / 1024 / 1024).toFixed(1)} MB...`;
                        await new Promise(r => setTimeout(r, 0));
                    }
                }

                setReady();
                performEgress(bestTokenId, maxActivation);

            } catch (e) {
                logToTerminal(`Inference Error: ${e.message}`, 'error');
                setReady();
            } finally {
                sendBtn.disabled = false;
            }
        }

        init();
    </script>
</body>
</html>
