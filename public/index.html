<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAN | Inference Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-green-400 font-mono p-4 flex flex-col h-screen">
    <div class="max-w-3xl mx-auto w-full flex flex-col h-full">
        <header class="mb-4 border-b border-green-800 pb-4 shrink-0">
            <h1 class="text-2xl font-bold tracking-widest text-white">SWAN INFERENCE</h1>
            <div id="status" class="text-xs text-yellow-500 font-bold">Initializing Engine...</div>
        </header>

        <div id="terminal" class="bg-gray-900 p-4 rounded border border-green-800 mb-4 flex-1 overflow-y-auto text-xs whitespace-pre-wrap"></div>

        <div id="controls" class="hidden flex gap-2 shrink-0">
            <input type="text" id="prompt" class="flex-1 bg-gray-900 border border-green-800 p-3 text-white outline-none" placeholder="Enter query...">
            <button onclick="runInference()" class="bg-green-900 px-6 py-2 hover:bg-green-700 text-white font-bold transition" id="sendBtn">SEND</button>
        </div>
    </div>

    <script type="module">
        // OPTION A: Import True BPE Tokenizer
        import { env, AutoTokenizer } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1/dist/transformers.min.js';
        env.allowLocalModels = false; // Force fetching from HuggingFace Hub
        
        window.AutoTokenizer = AutoTokenizer; // Expose globally
    </script>

    <script>
        const terminal = document.getElementById('terminal');
        const statusDiv = document.getElementById('status');
        const controls = document.getElementById('controls');
        const sendBtn = document.getElementById('sendBtn');

        let logBuffer = [];
        let isLogging = false;
        let tokenizer = null;
        
        // Qwen 1.5B Architecture Specs
        const HIDDEN_SIZE = 1536; 
        const FLOAT_BYTES = 4;

        function flushLogs() {
            if (logBuffer.length === 0) {
                isLogging = false; return;
            }
            terminal.innerHTML += logBuffer.join('');
            logBuffer = [];
            terminal.scrollTop = terminal.scrollHeight;
            requestAnimationFrame(flushLogs);
        }

        function logToTerminal(msg, type = 'log') {
            const color = type === 'error' ? 'text-red-500' : type === 'system' ? 'text-blue-400 font-bold' : 'text-green-500';
            logBuffer.push(`<div class="${color}">> ${msg}</div>`);
            if (!isLogging) {
                isLogging = true;
                requestAnimationFrame(flushLogs);
            }
            if (type === 'error') console.error(msg);
            else console.log(msg);
        }

        function connectSSE() {
            const evtSource = new EventSource("/api/events");
            evtSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    logToTerminal(data.message, data.type);
                    if (data.type === 'complete') setReady();
                    else if (data.type === 'error') setError();
                } catch (e) {}
            };
        }

        function setReady() {
            if (!tokenizer) return; // Wait for tokenizer
            statusDiv.innerText = "System Ready [I7 Manifold + Tokenizer Active]";
            statusDiv.className = "text-xs text-blue-500 font-bold";
            controls.classList.remove('hidden');
        }

        function setError() {
            statusDiv.innerText = "System Fault";
            statusDiv.className = "text-xs text-red-500 font-bold";
        }

        async function init() {
            logToTerminal("System terminal initialized...", "log");
            
            // 1. Initialize Server Connection
            connectSSE();
            try {
                const res = await fetch('/api/check');
                if ((await res.json()).ready) {
                    logToTerminal("F32 Cache & I7 Manifold Verified.", "system");
                } else {
                    statusDiv.innerText = "Installing: Building pipeline...";
                    await fetch('/api/install');
                }
            } catch(e) {
                logToTerminal("Check failed. Retrying...", "error");
            }

            // 2. Initialize True Tokenizer
            logToTerminal("Downloading Qwen BPE Tokenizer maps...", "system");
            try {
                // Xenova/Qwen1.5-0.5B shares the exact same vocab logic as 2.5
                tokenizer = await window.AutoTokenizer.from_pretrained('Xenova/Qwen1.5-0.5B');
                logToTerminal("Tokenizer initialized successfully.", "system");
                setReady();
            } catch (e) {
                logToTerminal(`Tokenizer Error: ${e.message}`, "error");
            }
        }

        // OPFS Storage Manager
        async function getModelFromOPFS(filename, url) {
            const opfsRoot = await navigator.storage.getDirectory();
            const headRes = await fetch(url, { method: 'HEAD' });
            if (!headRes.ok) throw new Error(`Could not fetch metadata`);
            const totalSize = parseInt(headRes.headers.get('content-length'), 10);
            
            let fileHandle = await opfsRoot.getFileHandle(filename, { create: true });
            let fileInfo = await fileHandle.getFile();
            
            if (fileInfo.size === totalSize) return fileInfo;

            logToTerminal(`Downloading ${filename} in chunks...`, 'system');
            const writable = await fileHandle.createWritable();
            const CHUNK_SIZE = 5 * 1024 * 1024; 
            let downloaded = 0;

            while (downloaded < totalSize) {
                const end = Math.min(downloaded + CHUNK_SIZE - 1, totalSize - 1);
                const res = await fetch(url, { headers: { 'Range': `bytes=${downloaded}-${end}` } });
                await writable.write(await res.arrayBuffer());
                downloaded = end + 1;
                statusDiv.innerText = `Downloading: ${(downloaded/1024/1024).toFixed(1)}MB`;
            }
            await writable.close();
            return await fileHandle.getFile(); 
        }

        async function runInference() {
            const input = document.getElementById('prompt').value;
            if (!input) return;

            sendBtn.disabled = true;
            logToTerminal(`\n[USER] ${input}`, 'log');
            
            try {
                // --- PHASE 1: TRUE TOKENIZATION ---
                const tokens = tokenizer.encode(input);
                logToTerminal(`[TOKENIZER] BPE IDs: [${tokens.join(', ')}]`, 'system');
                
                // For next-token prediction, we extract the embedding of the *last* token
                const lastTokenId = tokens[tokens.length - 1];

                // Ensure file exists in OPFS
                const file = await getModelFromOPFS('projected_embed_tokens.bin', '/model/i7/projected_embed_tokens.bin');
                
                // --- PHASE 2: REAL EMBEDDING LOOKUP (O(1) Disk Seek) ---
                logToTerminal(`[INGEST] Seeking embedding vector for ID: ${lastTokenId}...`, 'system');
                const byteOffset = lastTokenId * HIDDEN_SIZE * FLOAT_BYTES;
                
                // Seek directly to the row using File.slice! No loading the whole file!
                const vectorSlice = file.slice(byteOffset, byteOffset + (HIDDEN_SIZE * FLOAT_BYTES));
                const hiddenState = new Float32Array(await vectorSlice.arrayBuffer());
                
                logToTerminal(`[INGEST] Vector Extracted. Dim 0: ${hiddenState[0].toFixed(4)}`, 'system');

                // --- PHASE 3: TRANSFORMER CORE SCAFFOLD ---
                // [FUTURE WORK]: Implement RMSNorm, RoPE, and loop through model.layers.X.bin here
                logToTerminal(`[TRANSFORMER] Bypassing hidden layers (Scaffold mode)...`, 'system');


                // --- PHASE 4: FULL EGRESS DECODING ---
                logToTerminal("[EGRESS] Streaming LM_Head projection from OPFS...", 'system');

                const reader = file.stream().getReader();
                let processedBytes = 0;
                let leftover = new Uint8Array(0);
                let loopCount = 0;

                let maxActivation = -Infinity;
                let bestTokenId = -1;
                let currentTokenId = 0;
                let currentActivation = 0;
                let hiddenDimIndex = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    processedBytes += value.length;

                    const merged = new Uint8Array(leftover.length + value.length);
                    merged.set(leftover);
                    merged.set(value, leftover.length);

                    const validLength = merged.length - (merged.length % 4);
                    leftover = merged.slice(validLength); 

                    const floats = new Float32Array(merged.buffer, merged.byteOffset, validLength / 4);

                    for(let i = 0; i < floats.length; i++) {
                        currentActivation += floats[i] * hiddenState[hiddenDimIndex];
                        hiddenDimIndex++;

                        if (hiddenDimIndex === HIDDEN_SIZE) {
                            if (currentActivation > maxActivation) {
                                maxActivation = currentActivation;
                                bestTokenId = currentTokenId;
                            }
                            currentTokenId++;
                            currentActivation = 0;
                            hiddenDimIndex = 0;
                        }
                    }

                    loopCount++;
                    if (loopCount % 5 === 0) {
                        statusDiv.innerText = `Computing Egress: ${(processedBytes / 1024 / 1024).toFixed(1)} MB...`;
                        await new Promise(r => setTimeout(r, 0));
                    }
                }

                // Decode the winning token back to text
                const predictedText = tokenizer.decode([bestTokenId]);
                logToTerminal(`\n[DECODER] Max Activation: ${maxActivation.toFixed(4)}`, 'system');
                logToTerminal(`[DECODER] Predicted ID: ${bestTokenId}`, 'system');
                logToTerminal(`[OUTPUT] "${predictedText}"\n`, 'log');

                setReady();
            } catch (e) {
                logToTerminal(`Inference Error: ${e.message}`, 'error');
                setReady();
            } finally {
                sendBtn.disabled = false;
            }
        }

        // Delay init slightly to ensure module script loads
        setTimeout(init, 500);
    </script>
</body>
</html>
