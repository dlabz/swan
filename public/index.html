<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAN | Inference Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-green-400 font-mono p-4 flex flex-col h-screen">
    <div class="max-w-3xl mx-auto w-full flex flex-col h-full">
        <header class="mb-4 border-b border-green-800 pb-4 shrink-0">
            <h1 class="text-2xl font-bold tracking-widest text-white">SWAN INFERENCE</h1>
            <div id="status" class="text-xs text-yellow-500 font-bold">Checking manifold...</div>
        </header>

        <!-- SSE Terminal Output -->
        <div id="terminal" class="bg-gray-900 p-4 rounded border border-green-800 mb-4 flex-1 overflow-y-auto text-xs whitespace-pre-wrap">
            <p class="text-gray-500">System terminal initialized...</p>
        </div>

        <div id="controls" class="hidden flex gap-2 shrink-0">
            <input type="text" id="prompt" class="flex-1 bg-gray-900 border border-green-800 p-3 text-white outline-none" placeholder="Enter query...">
            <button onclick="runInference()" class="bg-green-900 px-6 py-2 hover:bg-green-700 text-white font-bold transition">SEND</button>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const statusDiv = document.getElementById('status');
        const controls = document.getElementById('controls');

        function logToTerminal(msg, type = 'log') {
            const color = type === 'error' ? 'text-red-500' : 
                          type === 'system' ? 'text-blue-400 font-bold' : 
                          'text-green-500';
            
            terminal.innerHTML += `<div class="${color}">> ${msg}</div>`;
            terminal.scrollTop = terminal.scrollHeight; // Auto-scroll to bottom
        }

        // Initialize Server-Sent Events Connection
        function connectSSE() {
            const evtSource = new EventSource("/api/events");
            
            evtSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                logToTerminal(data.message, data.type);

                if (data.type === 'complete') {
                    statusDiv.innerText = "System Ready [I7 Manifold Active]";
                    statusDiv.className = "text-xs text-blue-500 font-bold";
                    controls.classList.remove('hidden');
                } else if (data.type === 'error') {
                    statusDiv.innerText = "System Fault";
                    statusDiv.className = "text-xs text-red-500 font-bold";
                }
            };

            evtSource.onerror = () => {
                logToTerminal("Lost connection to stream...", "error");
                evtSource.close();
            };
        }

        async function init() {
            connectSSE(); // Start listening to server logs immediately

            const res = await fetch('/api/check');
            const { ready } = await res.json();

            if (!ready) {
                statusDiv.innerText = "Installing: Building pipeline...";
                // Trigger the installation (runs in background on server)
                await fetch('/api/install');
            } else {
                statusDiv.innerText = "System Ready [I7 Manifold Active]";
                statusDiv.className = "text-xs text-blue-500 font-bold";
                controls.classList.remove('hidden');
                logToTerminal("F32 Cache & I7 Manifold Verified.", "system");
            }
        }
        
        async function runInference() {
            const input = document.getElementById('prompt').value;
            if (!input) return;

            logToTerminal(`Input: ${input}`, 'log');
            
            const vocab = { "hello": 101, "how": 102, "are": 103, "you": 104, "swan": 105, "clifford": 106 };
            const tokens = input.toLowerCase().split(' ').map(w => vocab[w] || 0);
            const projection = tokens.map(t => Math.tanh(t * 0.003));
            
            try {
                // Fetch the projected weights
                const res = await fetch('/model/i7/projected_lm_head.bin');
                if (!res.ok) throw new Error("Could not load projected manifold");
                
                const buffer = await res.arrayBuffer();
                const validLength = buffer.byteLength - (buffer.byteLength % 4);
                const weights = new Float32Array(buffer.slice(0, validLength));

                let prediction = 0;
                const len = Math.min(projection.length, weights.length);
                for(let i = 0; i < len; i++) {
                    prediction += projection[i] * weights[i];
                }

                logToTerminal(`Manifold Resonance: ${prediction.toFixed(6)}`, 'system');
            } catch (e) {
                logToTerminal(`Inference Error: ${e.message}`, 'error');
            }
        }

        init();
    </script>
</body>
</html>
