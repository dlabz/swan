<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Eruda for mobile debugging -->
    <script src="/vendor/eruda.js"></script>
    <script>eruda.init();</script>
    <title>SWAN Engine</title>
    <script src="/vendor/tailwindcss.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        #terminal { height: calc(100vh - 200px); }
    </style>
</head>
<body class="bg-black text-green-400 p-4 h-full flex flex-col">
    
    <div class="flex justify-between items-center mb-2">
        <h1 class="text-xs font-bold uppercase tracking-widest text-green-600">Swan Manifold</h1>
        <div id="heartbeat" class="w-2 h-2 rounded-full bg-red-600"></div>
    </div>

    <div id="terminal" class="border border-green-900 bg-gray-950 p-2 overflow-y-auto text-[10px] font-mono shadow-inner rounded-sm">
        <div class="text-green-800">System Ready. Awaiting connection...</div>
    </div>

    <div class="mt-auto pt-2 space-y-2">
        <input id="prompt" placeholder="Input prompt..." class="w-full bg-gray-900 border border-green-800 p-3 text-white rounded-lg text-sm">
        
        <div class="grid grid-cols-2 gap-2">
            <button id="run" class="bg-green-900 hover:bg-green-800 text-white font-bold py-3 rounded-lg text-xs transition-all">INFERENCE</button>
            <button id="clear-opfs" class="bg-red-900/50 hover:bg-red-800 text-red-200 py-3 rounded-lg text-xs transition-all border border-red-800">INVALIDATE OPFS</button>
        </div>
    </div>

    <script type="module">
        import { SwanPipeline, SwanUI, SwanStorage } from './js/swan.js';
        import { SwanMathEngine } from './js/swanMath.js';
        import { env, AutoTokenizer } from './vendor/transformers.min.js';

        // SSE Log Integration
        const eventSource = new EventSource('/api/events');
        const terminal = document.getElementById('terminal');
        const heartbeat = document.getElementById('heartbeat');

        eventSource.onmessage = (e) => {
            const data = JSON.parse(e.data);
            const entry = document.createElement('div');
            entry.className = data.type === 'error' ? 'text-red-400' : 'text-green-300';
            entry.textContent = `> ${data.message}`;
            terminal.prepend(entry);
            heartbeat.classList.replace('bg-red-600', 'bg-green-500');
            setTimeout(() => heartbeat.classList.replace('bg-green-500', 'bg-red-600'), 1000);
        };

        // OPFS Invalidation
        document.getElementById('clear-opfs').onclick = async () => {
            if (confirm("Clear all local storage shards?")) {
                const root = await navigator.storage.getDirectory();
                for await (const name of root.keys()) {
                    await root.removeEntry(name, { recursive: true });
                }
                SwanUI.log("OPFS Invalidated.");
            }
        };

        async function bootstrap() {
            try {
                await SwanPipeline.ensureReady(SwanUI);
                
                // Configure transformers to load only local files
                env.allowRemoteModels = false;
                env.allowLocalModels = false; // "local" means Node.js fs, we use URLs instead
                const tokenizer = await AutoTokenizer.from_pretrained('/model/tokenizer/');
                
                SwanUI.log("Tokenizer & Pipeline ready.");
                
                const mathEngine = new SwanMathEngine(SwanUI);
                await mathEngine.init();

                await mathEngine.loadAllWeights((current, total) => {
                    if (current % 4 === 0) {
                        SwanUI.log(`Loading layer ${current}/${total}...`, "system");
                    }
                });

                document.getElementById('run').onclick = async () => {
                    const prompt = document.getElementById('prompt').value || "Hello, world!";
                    SwanUI.log(`Tokenizing prompt: "${prompt}"`);
                    const tokens = await tokenizer(prompt);
                    const tokenIds = tokens.input_ids.data;
                    SwanUI.log(`Tokens: [${tokenIds.join(', ')}]`);
                    
                    let generatedTokens = [];
                    let maxTokens = 20;
                    
                    try {
                        SwanUI.log(`Processing prompt to build KV cache...`);
                        let currentPos = 0;
                        for (let i = 0; i < tokenIds.length - 1; i++) {
                            await mathEngine.forward(Number(tokenIds[i]), currentPos);
                            currentPos++;
                        }
                        
                        let currentToken = Number(tokenIds[tokenIds.length - 1]);
                        
                        for (let step = 0; step < maxTokens; step++) {
                            // Run the full WebGPU forward pass
                            const bestToken = await mathEngine.forward(currentToken, currentPos);
                            
                            generatedTokens.push(bestToken);
                            currentToken = bestToken;
                            currentPos++;
                            
                            const decoded = await tokenizer.decode([bestToken]);
                            SwanUI.log(`[Step ${step+1}] ID: ${bestToken} -> "${decoded}"`, "system");
                            
                            if (bestToken === 151643 || bestToken === 151645) {
                                SwanUI.log("Generation finished (EOS token reached).", "system");
                                break;
                            }
                            
                            await new Promise(r => setTimeout(r, 1));
                        }
                        
                        const fullDecoded = await tokenizer.decode(generatedTokens);
                        SwanUI.log(`Final sequence: "${fullDecoded}"`);
                        
                    } catch (err) {
                        SwanUI.log(`Inference Error: ${err.message}`, 'error');
                    }
                };
            } catch (e) {
                console.error("Bootstrap error:", e);
                terminal.prepend(document.createElement('div').textContent = `ERR: ${e.message}`);
            }
        }
        bootstrap();
    </script>
</body>
</html>
