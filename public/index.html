<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAN | Modular Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-green-400 font-mono p-4 flex flex-col h-screen">
    <div class="max-w-3xl mx-auto w-full flex flex-col h-full">
        <header class="mb-4 border-b border-green-800 pb-4 shrink-0 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold tracking-widest text-white">SWAN INFERENCE</h1>
                <div id="status" class="text-xs text-yellow-500 font-bold">Initializing Engine Modules...</div>
            </div>
            <button onclick="SwanStorage.clearCache()" class="text-xs border border-red-800 text-red-500 hover:bg-red-900 px-3 py-1 transition">Reset OPFS Cache</button>
        </header>

        <div id="terminal" class="bg-gray-900 p-4 rounded border border-green-800 mb-4 flex-1 overflow-y-auto text-xs whitespace-pre-wrap"></div>

        <div id="controls" class="hidden flex gap-2 shrink-0">
            <input type="text" id="prompt" class="flex-1 bg-gray-900 border border-green-800 p-3 text-white outline-none" placeholder="Enter query...">
            <button onclick="SwanCore.runInference()" class="bg-green-900 px-6 py-2 hover:bg-green-700 text-white font-bold transition" id="sendBtn">SEND</button>
        </div>
    </div>

    <script type="module">
        import { env, AutoTokenizer } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1/dist/transformers.min.js';
        env.allowLocalModels = false;

        const Config = {
            HIDDEN_SIZE: 1536,
            BF16_BYTES: 2,
            MAX_CHUNK_SIZE: 5 * 1024 * 1024
        };

        const SwanUI = {
            terminal: document.getElementById('terminal'),
            status: document.getElementById('status'),
            controls: document.getElementById('controls'),
            btn: document.getElementById('sendBtn'),
            buffer: [],
            isLogging: false,

            flush() {
                if (SwanUI.buffer.length === 0) { SwanUI.isLogging = false; return; }
                SwanUI.terminal.innerHTML += SwanUI.buffer.join('');
                SwanUI.buffer = [];
                SwanUI.terminal.scrollTop = SwanUI.terminal.scrollHeight;
                requestAnimationFrame(SwanUI.flush);
            },

            log(msg, type = 'log') {
                const color = type === 'error' ? 'text-red-500' : type === 'system' ? 'text-blue-400 font-bold' : 'text-green-500';
                SwanUI.buffer.push(`<div class="${color}">> ${msg}</div>`);
                if (!SwanUI.isLogging) { SwanUI.isLogging = true; requestAnimationFrame(SwanUI.flush); }
                if (type === 'error') console.error(msg); else console.log(msg);
            },

            setReady() {
                SwanUI.status.innerText = "System Ready [Modules Active]";
                SwanUI.status.className = "text-xs text-blue-500 font-bold";
                SwanUI.controls.classList.remove('hidden');
            }
        };

        const SwanStorage = {
            async getModelFile(filename, url) {
                const opfsRoot = await navigator.storage.getDirectory();
                const fileHandle = await opfsRoot.getFileHandle(filename, { create: true });
                const fileInfo = await fileHandle.getFile();

                const headRes = await fetch(url, { method: 'HEAD' });
                const totalSize = parseInt(headRes.headers.get('content-length') || "0", 10);
                
                if (fileInfo.size > 0 && (totalSize === 0 || fileInfo.size === totalSize)) {
                    SwanUI.log(`[Cache Hit] Loaded ${filename} from OPFS.`, 'system');
                    return fileInfo;
                }

                SwanUI.log(`Downloading fresh copy of ${filename}...`, 'system');
                const writable = await fileHandle.createWritable();
                
                if (totalSize > Config.MAX_CHUNK_SIZE) {
                    let downloaded = 0;
                    while (downloaded < totalSize) {
                        const end = Math.min(downloaded + Config.MAX_CHUNK_SIZE - 1, totalSize - 1);
                        const res = await fetch(url, { headers: { 'Range': `bytes=${downloaded}-${end}` } });
                        await writable.write(await res.arrayBuffer());
                        downloaded = end + 1;
                        SwanUI.status.innerText = `Downloading: ${(downloaded/1024/1024).toFixed(1)}MB`;
                    }
                } else {
                    const res = await fetch(url);
                    await res.body.pipeTo(writable);
                }
                
                await writable.close();
                return await fileHandle.getFile();
            },

            async clearCache() {
                if(!confirm("Are you sure you want to wipe the 450MB OPFS Model Cache? You will need to re-download it on the next run.")) return;
                try {
                    const opfsRoot = await navigator.storage.getDirectory();
                    // @ts-ignore - TS DOM lib missing async iterator for OPFS, but it exists
                    for await (const name of opfsRoot.keys()) {
                        await opfsRoot.removeEntry(name, { recursive: true });
                    }
                    SwanUI.log("OPFS Cache completely wiped. Reloading page...", "system");
                    setTimeout(() => window.location.reload(), 1500);
                } catch(e) {
                    SwanUI.log(`Failed to clear cache: ${e.message}`, "error");
                }
            }
        };

        const SwanMath = {
            decodeBfloat16(bf16Bytes) {
                const f32Bytes = new Uint8Array(bf16Bytes.length * 2);
                for (let i = 0; i < bf16Bytes.length; i += 2) {
                    f32Bytes[i * 2 + 2] = bf16Bytes[i];     
                    f32Bytes[i * 2 + 3] = bf16Bytes[i + 1]; 
                }
                return new Float32Array(f32Bytes.buffer);
            },

            rmsnorm(x, weight, eps = 1e-6) {
                let sqSum = 0;
                for (let i = 0; i < x.length; i++) sqSum += x[i] * x[i];
                let variance = sqSum / x.length;
                let invStd = 1.0 / Math.sqrt(variance + eps);
                
                let out = new Float32Array(x.length);
                for (let i = 0; i < x.length; i++) {
                    out[i] = (x[i] * invStd) * weight[i];
                }
                return out;
            },
            
            // Deep scanner to find exactly which dimension corrupts
            validateVector(arr, context) {
                for(let i = 0; i < arr.length; i++) {
                    if (Number.isNaN(arr[i])) throw new Error(`NaN encountered at dimension ${i} during ${context}`);
                }
            }
        };

        const SwanCore = {
            tokenizer: null,

            async init() {
                SwanUI.log("System terminal initialized...", "log");
                
                const evtSource = new EventSource("/api/events");
                evtSource.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        SwanUI.log(data.message, data.type);
                    } catch (e) {}
                };

                try {
                    const res = await fetch('/api/check');
                    if ((await res.json()).ready) {
                        SwanUI.log("Pipeline Verified.", "system");
                    } else {
                        fetch('/api/install'); 
                    }
                } catch(e) {}

                try {
                    SwanUI.log("Initializing Tokenizer Engine...", "system");
                    SwanCore.tokenizer = await AutoTokenizer.from_pretrained('Xenova/Qwen1.5-0.5B');
                    SwanUI.setReady();
                } catch (e) {
                    SwanUI.log(`Tokenizer Error: ${e.message}`, "error");
                }
            },

            async runInference() {
                const promptEl = document.getElementById('prompt');
                const input = promptEl.value;
                if (!input || !SwanCore.tokenizer) return;

                SwanUI.btn.disabled = true;
                SwanUI.log(`\n[USER] ${input}`, 'log');
                
                try {
                    const tokens = SwanCore.tokenizer.encode(input);
                    const lastTokenId = tokens[tokens.length - 1];
                    SwanUI.log(`[TOKENIZER] BPE IDs: [${tokens.join(', ')}]`, 'system');

                    const embedFile = await SwanStorage.getModelFile('projected_embed_tokens.bin', '/model/i7/projected_embed_tokens.bin');
                    
                    const byteOffset = lastTokenId * Config.HIDDEN_SIZE * Config.BF16_BYTES;
                    const vectorSlice = embedFile.slice(byteOffset, byteOffset + (Config.HIDDEN_SIZE * Config.BF16_BYTES));
                    
                    const embedBytes = new Uint8Array(await vectorSlice.arrayBuffer());
                    let hiddenState = SwanMath.decodeBfloat16(embedBytes);
                    
                    SwanMath.validateVector(hiddenState, "Embedding Extraction");
                    SwanUI.log(`[INGEST] Vector Extracted. Dim 0: ${hiddenState[0].toFixed(4)}`, 'system');

                    const normFile = await SwanStorage.getModelFile('projected_model.layers.0.input_layernorm.weight.bin', '/model/i7/projected_model.layers.0.input_layernorm.weight.bin');
                    const normWeight = SwanMath.decodeBfloat16(new Uint8Array(await normFile.arrayBuffer()));
                    
                    SwanMath.validateVector(normWeight, "RMSNorm Weight Load");
                    
                    hiddenState = SwanMath.rmsnorm(hiddenState, normWeight);
                    SwanMath.validateVector(hiddenState, "RMSNorm Math Applied");
                    
                    SwanUI.log(`[TRANSFORMER] RMSNorm applied. Dim 0 shifted to: ${hiddenState[0].toFixed(4)}`, 'system');

                    SwanUI.log("[EGRESS] Streaming Vocabulary Logits...", 'system');
                    const reader = embedFile.stream().getReader();
                    
                    let maxActivation = -Infinity;
                    let bestTokenId = -1;
                    
                    let processedBytes = 0;
                    let leftover = new Uint8Array(0);
                    let loopCount = 0;
                    
                    let currentTokenId = 0;
                    let currentActivation = 0;
                    let hiddenDimIndex = 0;

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        processedBytes += value.length;
                        const merged = new Uint8Array(leftover.length + value.length);
                        merged.set(leftover);
                        merged.set(value, leftover.length);

                        const validLength = merged.length - (merged.length % 2);
                        leftover = merged.slice(validLength); 
                        
                        const floats = SwanMath.decodeBfloat16(merged.slice(0, validLength));

                        for(let i = 0; i < floats.length; i++) {
                            currentActivation += floats[i] * hiddenState[hiddenDimIndex];
                            hiddenDimIndex++;

                            if (hiddenDimIndex === Config.HIDDEN_SIZE) {
                                if (currentActivation > maxActivation) {
                                    maxActivation = currentActivation;
                                    bestTokenId = currentTokenId;
                                }
                                currentTokenId++;
                                currentActivation = 0;
                                hiddenDimIndex = 0;
                            }
                        }

                        loopCount++;
                        if (loopCount % 5 === 0) {
                            SwanUI.status.innerText = `Egress Math: ${(processedBytes / 1024 / 1024).toFixed(1)} MB...`;
                            await new Promise(r => setTimeout(r, 0));
                        }
                    }

                    const predictedText = SwanCore.tokenizer.decode([bestTokenId]);
                    SwanUI.log(`\n[DECODER] Max Activation: ${maxActivation.toFixed(4)}`, 'system');
                    SwanUI.log(`[OUTPUT] "${predictedText}"\n`, 'log');

                } catch (e) {
                    SwanUI.log(`Inference Error: ${e.message}`, 'error');
                } finally {
                    SwanUI.setReady();
                    SwanUI.btn.disabled = false;
                }
            }
        };

        window.SwanStorage = SwanStorage;
        window.SwanCore = SwanCore;

        setTimeout(SwanCore.init, 500);
    </script>
</body>
</html>
