<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAN | Fixed Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-green-400 font-mono p-4 flex flex-col h-screen">
    <div class="max-w-3xl mx-auto w-full flex flex-col h-full">
        <header class="mb-4 border-b border-green-800 pb-4 shrink-0 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold tracking-widest text-white">SWAN INFERENCE</h1>
                <div id="status" class="text-xs text-yellow-500 font-bold">Initializing...</div>
            </div>
            <button onclick="window.SwanStorage.clearCache()" class="text-xs border border-red-800 text-red-500 px-3 py-1">Wipe Cache</button>
        </header>
        <div id="terminal" class="bg-gray-900 p-4 rounded border border-green-800 mb-4 flex-1 overflow-y-auto text-xs whitespace-pre-wrap"></div>
        <div id="controls" class="hidden flex gap-2 shrink-0">
            <input type="text" id="prompt" class="flex-1 bg-gray-900 border border-green-800 p-3 text-white outline-none" placeholder="Enter query...">
            <button onclick="window.SwanCore.runInference()" class="bg-green-900 px-6 py-2 hover:bg-green-700 text-white font-bold" id="sendBtn">SEND</button>
        </div>
    </div>

    <script type="module">
        import { AutoTokenizer } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1/dist/transformers.min.js';

        const Config = { HIDDEN_SIZE: 1536, BF16_BYTES: 2 };

        window.SwanStorage = {
            async getModelFile(filename, url) {
                const opfsRoot = await navigator.storage.getDirectory();
                try {
                    const handle = await opfsRoot.getFileHandle(filename);
                    const file = await handle.getFile();
                    return file;
                } catch {
                    const res = await fetch(url);
                    const blob = await res.blob();
                    const handle = await opfsRoot.getFileHandle(filename, { create: true });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    return await handle.getFile();
                }
            },
            async clearCache() {
                const root = await navigator.storage.getDirectory();
                for await (const name of root.keys()) await root.removeEntry(name, { recursive: true });
                window.location.reload();
            }
        };

        window.SwanCore = {
            tokenizer: null,
            async init() {
                this.tokenizer = await AutoTokenizer.from_pretrained('Xenova/Qwen1.5-0.5B');
                document.getElementById('controls').classList.remove('hidden');
                document.getElementById('status').innerText = "System Ready";
            },
            async runInference() {
                try {
                    const input = document.getElementById('prompt').value;
                    const tokens = this.tokenizer.encode(input);
                    const embedFile = await window.SwanStorage.getModelFile('embed_tokens.bin', '/model/i7/projected_embed_tokens.bin');
                    
                    const offset = tokens[0] * Config.HIDDEN_SIZE * Config.BF16_BYTES;
                    if (offset + (Config.HIDDEN_SIZE * Config.BF16_BYTES) > embedFile.size) {
                        throw new Error(`Out of bounds: File size ${embedFile.size} is too small for offset ${offset}`);
                    }
                    
                    // ... rest of inference logic
                    document.getElementById('terminal').innerHTML += `<div class="text-blue-400">> Inference started for ${tokens.length} tokens</div>`;
                } catch(e) { 
                    document.getElementById('terminal').innerHTML += `<div class="text-red-500">> Error: ${e.message}</div>`;
                }
            }
        };

        window.SwanCore.init();
    </script>
</body>
</html>
