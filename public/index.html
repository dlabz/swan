<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAN | Inference Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-green-400 font-mono p-4">
    <div class="max-w-xl mx-auto">
        <header class="mb-6 border-b border-green-800 pb-4">
            <h1 class="text-2xl font-bold tracking-widest text-white">SWAN INFERENCE</h1>
            <div id="status" class="text-xs text-yellow-500">Checking manifold...</div>
        </header>

        <div id="output" class="bg-gray-900 p-4 rounded min-h-[150px] border-l-4 border-green-500 mb-4 overflow-y-auto">
            <p class="text-gray-400">Initializing system...</p>
        </div>

        <input type="text" id="prompt" class="w-full bg-gray-900 border border-green-800 p-3 text-white outline-none" placeholder="Enter query...">
    </div>

    <script>
        // Automatic Pipeline Sync
        async function init() {
            const statusDiv = document.getElementById('status');
            const res = await fetch('/api/check');
            const { ready } = await res.json();

            if (!ready) {
                statusDiv.innerText = "Installing Manifold...";
                const source = new EventSource('/api/install');
                source.onmessage = (e) => {
                    const data = JSON.parse(e.data);
                    if (data.status === 'READY') {
                        statusDiv.innerText = "System Ready";
                        source.close();
                    } else {
                        statusDiv.innerText = data.status;
                    }
                };
            } else {
                statusDiv.innerText = "System Ready";
            }
        }

        async function runInference() {
            // ... (Your existing runInference logic remains here)
        }

        init();
    </script>
</body>
</html>
