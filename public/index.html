<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAN | Inference Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-green-400 font-mono p-4">
    <div class="max-w-xl mx-auto">
        <header class="mb-6 border-b border-green-800 pb-4">
            <h1 class="text-2xl font-bold tracking-widest text-white">SWAN INFERENCE</h1>
        </header>

        <div id="output" class="bg-gray-900 p-4 rounded min-h-[150px] border-l-4 border-green-500 mb-4 overflow-y-auto">
            <p class="text-gray-400">Awaiting input prompt...</p>
        </div>

        <div class="flex gap-2">
            <input type="text" id="prompt" class="flex-1 bg-gray-900 border border-green-800 p-3 text-white outline-none" placeholder="Enter query...">
            <button onclick="runInference()" class="bg-green-900 px-6 py-2 hover:bg-green-700 text-white font-bold uppercase">Generate</button>
        </div>
    </div>

    <script>
        // Tiny Tokenizer (Simplified BPE map)
        const vocab = { "hello": 101, "how": 102, "are": 103, "you": 104, "swan": 105 };

        async function runInference() {
            const input = document.getElementById('prompt').value;
            const output = document.getElementById('output');
            
            // 1. Tokenize
            const tokens = input.toLowerCase().split(' ').map(w => vocab[w] || 0);
            output.innerHTML = `<p class="text-xs text-green-700">Tokens: ${tokens.join(', ')}</p>`;

            // 2. Project Input into Clifford Basis (i7)
            // Simulating projection: token value *Basis anchor
            const projection = tokens.map(t => Math.tanh(t * 0.003));
            
            // 3. Stream Weights from Server
            log("Fetching manifold tiles...");
            const res = await fetch('/model/i7/weights_000.bin');
            const buffer = await res.arrayBuffer();
            const weights = new Float32Array(buffer);

            // 4. Compute (Dot product of Projected Input + Weights)
            let prediction = 0;
            for(let i=0; i<Math.min(projection.length, weights.length); i++) {
                prediction += projection[i] * weights[i];
            }

            // 5. Output
            output.innerHTML += `<p class="text-white mt-2">Projection: ${prediction.toFixed(4)}</p>`;
        }

        function log(msg) { console.log(msg); }
    </script>
</body>
</html>
