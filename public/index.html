<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAN | Inference Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-green-400 font-mono p-4">
    <div class="max-w-xl mx-auto">
        <header class="mb-6 border-b border-green-800 pb-4">
            <h1 class="text-2xl font-bold tracking-widest text-white">SWAN INFERENCE</h1>
            <div id="status" class="text-xs text-yellow-500">Checking manifold...</div>
        </header>

        <div id="output" class="bg-gray-900 p-4 rounded min-h-[150px] border-l-4 border-green-500 mb-4 overflow-y-auto">
            <p class="text-gray-400">Initializing system...</p>
        </div>

        <div id="controls" class="hidden flex gap-2">
            <input type="text" id="prompt" class="flex-1 bg-gray-900 border border-green-800 p-3 text-white outline-none" placeholder="Enter query...">
            <button onclick="runInference()" class="bg-green-900 px-6 py-2 hover:bg-green-700 text-white font-bold">SEND</button>
        </div>
    </div>

    <script>
        async function init() {
            const statusDiv = document.getElementById('status');
            const controls = document.getElementById('controls');
            
            const res = await fetch('/api/check');
            const { ready } = await res.json();

            if (!ready) {
                statusDiv.innerText = "Installing: Projecting all layers...";
                try {
                    const installRes = await fetch('/api/install');
                    const data = await installRes.json();
                    if (data.status === 'READY') {
                        statusDiv.innerText = "System Ready";
                        controls.classList.remove('hidden');
                    }
                } catch (e) {
                    statusDiv.innerText = "Error: " + e.message;
                }
            } else {
                statusDiv.innerText = "System Ready";
                controls.classList.remove('hidden');
            }
        }
        
        async function runInference() {
            const input = document.getElementById('prompt').value;
            const output = document.getElementById('output');
            const vocab = { "hello": 101, "how": 102, "are": 103, "you": 104, "swan": 105, "clifford": 106 };
            
            const tokens = input.toLowerCase().split(' ').map(w => vocab[w] || 0);
            const projection = tokens.map(t => Math.tanh(t * 0.003));
            
            // Note: Update this filename to one of your successfully projected files
            const res = await fetch('/model/i7/projected_lm_head.bin');
            const buffer = await res.arrayBuffer();
            const weights = new Float32Array(buffer);

            let prediction = 0;
            const len = Math.min(projection.length, weights.length);
            for(let i = 0; i < len; i++) {
                prediction += projection[i] * weights[i];
            }

            output.innerHTML = `
                <div class="animate-in fade-in">
                    <p class="text-xs text-green-700">Tokens: [${tokens.join(', ')}]</p>
                    <p class="text-white mt-2 text-xl tracking-widest">
                        Manifold output: <span class="text-blue-400 font-bold">${prediction.toFixed(6)}</span>
                    </p>
                </div>`;
        }

        init();
    </script>
</body>
</html>
